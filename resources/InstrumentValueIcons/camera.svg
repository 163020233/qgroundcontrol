<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<!-- 主镜头 -->
<circle cx="36" cy="36" r="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="36" cy="36" r="6" fill="#00CFFF" opacity="0.7"/>

<!-- 外框相机 -->
<rect x="12" y="16" width="48" height="40" rx="6" ry="6"
      fill="none" stroke="#FFFFFF" stroke-width="2"/>

<!-- 右上角的小点（闪光感） -->
<circle cx="56" cy="24" r="3" fill="#FFFFFF"/>

<!-- 外发光效果 -->
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00CFFF" flood-opacity="0.5"/>
</filter>
<rect x="12" y="16" width="48" height="40" rx="6" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
</svg>
