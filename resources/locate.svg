<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
    <!-- 中心节点 -->
    <circle cx="10" cy="10" r="2" fill="#FFFFFF"/>

    <!-- 左节点 -->
    <circle cx="4" cy="10" r="1.5" fill="#FFFFFF"/>
    <line x1="4" y1="10" x2="8" y2="10" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- 右节点 -->
    <circle cx="16" cy="10" r="1.5" fill="#FFFFFF"/>
    <line x1="12" y1="10" x2="16" y2="10" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- 上节点 -->
    <circle cx="10" cy="4" r="1.5" fill="#FFFFFF"/>
    <line x1="10" y1="4" x2="10" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- 下节点 -->
    <circle cx="10" cy="16" r="1.5" fill="#FFFFFF"/>
    <line x1="10" y1="12" x2="10" y2="16" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>

